name: Build Magisk Module

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      picoclaw_version:
        description: 'Upstream picoclaw version (e.g. v0.2.7)'
        required: true
        default: 'v0.2.7'

env:
  # 默认从 v0.2.7 取 (最后一个含 picoclaw-launcher-tui 的版本)
  # v0.2.9 已移除 tui
  PICOCLAW_VERSION: v0.2.7

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Download upstream picoclaw (Linux arm64)
        run: |
          # v0.2.7+ 提供 picoclaw_Linux_arm64.tar.gz (含 picoclaw + picoclaw-launcher + picoclaw-launcher-tui)
          wget -q --tries=3 --timeout=60 \
            "https://github.com/sipeed/picoclaw/releases/download/${PICOCLAW_VERSION}/picoclaw_Linux_arm64.tar.gz" \
            -O picoclaw.tar.gz
          tar -xzf picoclaw.tar.gz
          chmod +x picoclaw picoclaw-launcher picoclaw-launcher-tui
          ls -la picoclaw picoclaw-launcher picoclaw-launcher-tui
          
      - name: Create module directory
        run: |
          mkdir -p picoclaw-module
          cp picoclaw picoclaw-module/
          cp picoclaw-launcher picoclaw-module/
          cp picoclaw-launcher-tui picoclaw-module/
          cp module.prop picoclaw-module/
          cp service.sh picoclaw-module/
          cp post-fs-data.sh picoclaw-module/
          cp customize.sh picoclaw-module/
          cp action.sh picoclaw-module/
          cp tool.sh picoclaw-module/
          cp uninstall.sh picoclaw-module/
          # 只放示例配置,不放可能含敏感信息的 config.json
          cp config.example.json picoclaw-module/config.example.json
          cp .gitignore picoclaw-module/.gitignore
          ls -la picoclaw-module/
          
      - name: Create ZIP
        run: |
          cd picoclaw-module
          zip -r ../picoclaw-magisk.zip .
          cd ..
          ls -la picoclaw-magisk.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: picoclaw-magisk
          path: picoclaw-magisk.zip
          retention-days: 5
          
  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: picoclaw-magisk
          path: .
          
      - name: Create Release
        run: |
          # Delete existing release if any
          gh release delete ${{ github.ref_name }} --yes || true
          # Create new release with sanitized filename
          ZIP_NAME="picoclaw-magisk-${GITHUB_REF_NAME}.zip"
          mv picoclaw-magisk.zip "$ZIP_NAME"
          gh release create "${{ github.ref_name }}" "$ZIP_NAME" \
            --title "PicoClaw Magisk ${{ github.ref_name }}" \
            --notes-file CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
